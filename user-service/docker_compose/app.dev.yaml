services:
  main-app:
    build:
      context: ../
      dockerfile: Dockerfile

    environment:
      DB_URI: ${DB_URI:?}
      NATS_URI: ${NATS_URI:?}
      REDIS_URI: ${REDIS_URI:?}
      SESSION_EXPIRE_TIME: ${SESSION_EXPIRE_TIME:?}
  
    ports: 
      - "8000:8000"

    volumes:
      - ../src:/app/src

    command: "uvicorn --factory src.presentation.api.main:create_app --timeout-graceful-shutdown 2 --host 0.0.0.0 --port 8000 --reload"

    networks:
      - user-service_default
      - nats_network

networks:
  user-service_default:
    external: true
  nats_network:
    external: true
