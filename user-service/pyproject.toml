[tool.poetry]
name = "user_service"
version = "0.1.0"
description = ""
authors = ["slev-v <stasrudometkin2@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
dishka = "^1.2.0"
fastapi = "^0.112.2"
sqlalchemy = { extras = ["postgresql-asyncpg"], version = "^2.0.30" }
alembic = "^1.13.1"
bcrypt = "^4.1.3"
aiojobs = "^1.2.1"
orjson = "^3.10.6"
psycopg2-binary = "^2.9.9"
redis = "^5.0.7"
faststream = { extras = ["nats"], version = "^0.5.33" }
uvicorn = { extras = ["standart"], version = "^0.32.1" }
python-dotenv = "^1.0.1"


[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
ruff = "^0.4.6"
mypy = "^1.10.0"
pytest = "^8.3.2"
faker = "^26.2.0"
pytest-asyncio = "^0.23.8"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
